[project]
name = "atlas-tutor"
version = "0.1.0"
description = "Atlas — a local ReAct chat agent that tutors you on AI-agent architecture."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atlas Tutor" }]
dependencies = [
  "anthropic>=0.40.0",
  "chromadb>=0.5.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "gradio>=4.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py310"
