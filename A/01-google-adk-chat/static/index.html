<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --me:#2b5cff; --bot:#262a33; --fg:#e8eaf0; --muted:#8a90a0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid #2a2e38; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .meta { color:var(--muted); font-size:13px; }
  header button { margin-left:auto; }
  #log { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:10px; min-height:calc(100vh - 130px); }
  .msg { padding:10px 14px; border-radius:12px; max-width:78%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); }
  .bot  { align-self:flex-start; background:var(--bot); }
  .sys  { align-self:center; color:var(--muted); font-size:12px; }
  .err  { align-self:flex-start; background:#4a1f1f; color:#ffb3b3; }
  form { position:sticky; bottom:0; display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid #2a2e38; }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #333845; background:#0f1115; color:var(--fg); font-size:15px; }
  button { padding:10px 14px; border-radius:8px; border:0; background:var(--me); color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid #333845; color:var(--muted); }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>Local chat</h1>
  <span class="meta" id="meta">connecting…</span>
  <button class="ghost" id="reset">New chat</button>
</header>

<div id="log"></div>

<form id="form">
  <input id="input" placeholder="Type a message…" autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>

<script>
  // One session id per browser tab; the server keeps the conversation under it.
  let sessionId = crypto.randomUUID();
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  fetch("/health").then(r => r.json()).then(h => {
    document.getElementById("meta").textContent =
      `${h.framework} · ${h.provider} · ${h.model}`;
  }).catch(() => document.getElementById("meta").textContent = "backend unreachable");

  function add(cls, text = "") {
    const el = document.createElement("div");
    el.className = `msg ${cls}`;
    el.textContent = text;
    log.appendChild(el);
    el.scrollIntoView({ block: "end" });
    return el;
  }

  document.getElementById("reset").onclick = async () => {
    await fetch("/reset", { method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ session_id: sessionId }) });
    sessionId = crypto.randomUUID();
    log.innerHTML = "";
    add("sys", "new conversation");
  };

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;
    add("user", text);
    const bot = add("bot", "");

    // POST + read the SSE body by hand: EventSource only supports GET.
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();                      // keep the incomplete tail
      for (const frame of frames) {
        const line = frame.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const data = line.slice(6);
        if (data === "[DONE]") continue;
        const ev = JSON.parse(data);
        if (ev.delta) { bot.textContent += ev.delta; bot.scrollIntoView({ block: "end" }); }
        else if (ev.tool) add("sys", `⚙ tool: ${ev.tool}`);
        else if (ev.status) add("sys", ev.status);
        else if (ev.error) add("err", ev.error);
      }
    }
    if (!bot.textContent) bot.remove();
    send.disabled = false;
    input.focus();
  };
</script>
</body>
</html>
