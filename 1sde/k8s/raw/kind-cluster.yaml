# kind (Kubernetes IN Docker) cluster definition for the local demo.
#   kind create cluster --name guestbook --config kind-cluster.yaml
#
# - 1 control-plane + 2 workers, so topologySpread / scheduling are meaningful.
# - The control-plane is labelled and given extraPortMappings so ingress-nginx
#   can bind host ports 80/443 -> the cluster, making http://guestbook.localdev.me
#   reachable straight from your browser.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
