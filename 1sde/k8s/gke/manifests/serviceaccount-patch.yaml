# =============================================================================
# Workload Identity ServiceAccount Patch
#
# WHY annotate the KSA?
#   Workload Identity Federation requires BOTH sides of a binding:
#     1. The Kubernetes ServiceAccount (KSA) must carry the annotation
#        `iam.gke.io/gcp-service-account` pointing at the Google Service
#        Account (GSA) it should impersonate.
#     2. The GSA must have the `roles/iam.workloadIdentityUser` IAM binding
#        granting the KSA's Workload Identity subject permission to impersonate
#        it.  Terraform handles step 2 (see terraform/main.tf, resource
#        `google_service_account_iam_member.workload_identity_binding`).
#
# How it works at runtime:
#   1. Pod starts with serviceAccountName: guestbook-app.
#   2. GKE injects a projected volume with a short-lived OIDC token signed by
#      the cluster's OIDC issuer.
#   3. The GKE metadata server intercepts calls to the GCP metadata endpoint
#      (169.254.169.254) and exchanges the K8s token for a short-lived Google
#      OAuth access token for the GSA.
#   4. GCP client libraries automatically detect and use this token — no env
#      vars or key files needed.
#
# After running `terraform apply`, retrieve the GSA email:
#   terraform -chdir=k8s/gke/terraform output -raw gsa_email
# Then replace the TODO placeholder below.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guestbook-app
  namespace: guestbook
  annotations:
    # TODO: replace with the actual GSA email from:
    #   terraform -chdir=k8s/gke/terraform output -raw gsa_email
    # Format: SERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com
    iam.gke.io/gcp-service-account: "guestbook-app@YOUR_PROJECT_ID.iam.gserviceaccount.com"
