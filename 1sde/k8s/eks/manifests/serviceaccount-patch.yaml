# =============================================================================
# ServiceAccount patch -- add the IRSA annotation so pods can call AWS APIs.
#
# HOW IRSA (IAM Roles for Service Accounts) works:
#   1. The EKS control plane projects a short-lived OIDC token into every Pod
#      at a well-known path: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
#   2. The AWS SDK (boto3, aws-sdk-go, etc.) automatically picks up this token.
#   3. The SDK calls sts:AssumeRoleWithWebIdentity, presenting the token and
#      requesting the role in the annotation below.
#   4. IAM verifies the token signature against the cluster's OIDC provider and
#      checks that the `sub` claim matches the role's trust policy conditions:
#        system:serviceaccount:guestbook:guestbook-app
#   5. STS returns temporary credentials (no static keys needed anywhere!).
#
# WHY this matters vs. node-level IAM roles:
#   Without IRSA, all pods on a node share the node's IAM role. If one pod is
#   compromised it can call ANY AWS API the node role allows. IRSA gives each
#   pod its own, minimal identity -- true least-privilege at the pod level.
#
# What to fill in:
#   Replace the placeholder ARN with the role ARN created by:
#     - eksctl: printed as part of `eksctl create cluster`
#     - Terraform: `terraform output irsa_guestbook_app_role_arn`
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guestbook-app    # MUST match the name used in the Deployment's serviceAccountName
  namespace: guestbook
  annotations:
    # -------------------------------------------------------------------------
    # TODO: Replace with the actual role ARN.
    # From eksctl: eksctl get iamserviceaccount --cluster guestbook-eks -n guestbook
    # From Terraform: terraform output irsa_guestbook_app_role_arn
    # -------------------------------------------------------------------------
    eks.amazonaws.com/role-arn: "arn:aws:iam::TODO_ACCOUNT_ID:role/guestbook-eks-guestbook-app-irsa"

    # Optional: control the OIDC token expiration (default 86400s = 24h).
    # Shorter = more frequent rotation (more secure); longer = fewer STS calls.
    # eks.amazonaws.com/token-expiration: "86400"

    # Optional: restrict which audiences the projected token is valid for.
    # The AWS STS default is "sts.amazonaws.com" -- no change needed for IRSA.
    # eks.amazonaws.com/audience: "sts.amazonaws.com"

# automountServiceAccountToken is kept false in the base (app doesn't talk to
# the K8s API). The IRSA token is a SEPARATE projected volume added by the EKS
# pod identity webhook -- it is NOT the regular K8s service account token.
# So this setting stays false here and the webhook still injects the OIDC token.
automountServiceAccountToken: false
