spring:
  application:
    name: stripe-poc
  profiles:
    active: local
  datasource:
    url: jdbc:h2:file:./data/stripe-poc;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    include-message: always

# Stripe — override these via application-local.yml (gitignored) or env vars.
# Test keys look like:
#   STRIPE_SECRET_KEY=sk_test_...
#   STRIPE_PUBLISHABLE_KEY=pk_test_...
#   STRIPE_WEBHOOK_SECRET=whsec_...    (from `stripe listen`)
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: usd

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.example.stripepoc: DEBUG
    com.stripe: INFO
